# 로컬 실행용: PostgreSQL + PostGIS 만 실행합니다.
# 사용법 (레포 루트에서):
#   docker compose --env-file gorong-back/.env up -d
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gorong-db
    environment:
      POSTGRES_DB: ${DB_NAME:-gorong_db}
      POSTGRES_USER: ${DB_USERNAME:-gorong}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gorong1234}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - gorong-db-data:/var/lib/postgresql/data
      # 최초 1회 자동 실행: 확장(PostGIS), 스키마 생성
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

volumes:
  gorong-db-data:
