spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gorong_db}?currentSchema=gorong_schema&option=-c%20search_path%3Dgorong_schema%2Cpublic
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 기본은 none. 최초 스키마 생성 시에만 JPA_DDL_AUTO=update 로 실행
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: gorong_schema

tour:
  api:
    service-key: ${TOUR_API_KEY}
    base-url: https://apis.data.go.kr/B551011/KorService2

juso:
  api:
    key: ${JUSO_API_KEY}
  coord:
    key: ${JUSO_COORD_API_KEY}

gemini:
  api:
    key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-2.5-flash}

# 업로드 이미지는 로컬 폴더에 저장하고 /uploads/** 로 제공합니다.
app:
  storage:
    local-dir: ${APP_STORAGE_LOCAL_DIR:./uploads}
    # 폰에서도 이미지가 보이려면 PC의 로컬 IP 를 사용하세요. 예: http://192.168.0.10:8080
    base-url: ${APP_STORAGE_BASE_URL:http://localhost:8080}
