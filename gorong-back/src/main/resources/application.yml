spring:
  datasource:
    # URL 끝에 스키마를 명시하여 연결 시 기본 위치를 잡습니다.
    url: jdbc:postgresql://gorong-db.cwhkwq4kiz9p.us-east-1.rds.amazonaws.com:5432/gorong_db?currentSchema=gorong_schema
    username: postgres
    password: gorong0132!!  # 환경변수 대신 직접 입력 시
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Hibernate가 테이블을 생성할 때 gorong_schema를 사용하도록 강제합니다.
        default_schema: gorong_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect

